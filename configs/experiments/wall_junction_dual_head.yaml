# Wall junction dual-head: seg mask + junction heatmap
# Phase 1: Freeze existing seg model, train only the junction head
# Transfer learning from wall centerline model (epoch 22)

experiment: wall_junction_dual_head
seed: 0

# Transfer learning: load wall seg checkpoint, freeze existing params
transfer_ckpt: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/checkpoints/wall_centerline_epoch22.ckpt
freeze_existing: true  # freeze everything except junction_head

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 2
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 1.0
  early_stop_patience: 10

dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/processed
  val_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 8
  num_workers: 4
  junction_heatmap: true  # enable loading junction heatmaps
  aug:
    scale: [0.9, 1.1]
    hflip: 0.5
    vflip: 0.5
    color_jitter_p: 0.1
    gauss_noise_p: 0.0

model:
  name: sam_topolora
  sam_type: vit_b
  sam_checkpoint: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/checkpoints/sam_vit_b_01ec64.pth
  train_mask_decoder: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.0
    target_keywords: ["mlp", "fc1", "fc2"]
  adapter:
    enabled: true
    hidden_dim: 256
    kernel_size: 3
  prompt:
    learnable: false
  junction_head:
    enabled: true
    hidden_dim: 128

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  cldice_weight: 0.5
  boundary_weight: 0.0
  junction_weight: 1.0       # weight for junction heatmap loss
  junction_mse_weight: 1.0
  junction_dice_weight: 1.0

optimizer:
  name: adamw
  lr: 1e-3  # higher LR since only junction head is training
  weight_decay: 1e-4

scheduler:
  name: cosine

logging:
  wandb: false
  mlflow: true
  mlflow_validate: true
  mlflow_experiment: wall-junction-dual-head
  project: seglab
  entity: null
  tags: ["junction_heatmap", "dual_head", "phase1_frozen", "transfer_from_wall_ep22"]

artifacts:
  save_test_preds: true
  save_figures: false
  sample_pixels: 200000
  sample_pixels_per_image: 5000
  max_qual: 8
  bf_tol: 1
