# Wall centerline + junction heads with unfrozen output_upscaling
# Unfreeze mask decoder output_upscaling to let shared features adapt
# Seg loss active to preserve seg quality
# Transfer from best frozen centerline checkpoint (epoch 3, MAE 0.0709)

experiment: wall_centerline_head_unfreeze
seed: 0

# Transfer from the best frozen-head checkpoint (has trained centerline + junction weights)
transfer_ckpt: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/Seglab/checkpoints/wall_centerline_head/wall_centerline/sam_topolora/seed0/epoch=3-val/centerline_mae=0.0709.ckpt
freeze_existing: true
# Unfreeze output_upscaling so shared features can encode within-wall position
unfreeze_keywords: ["output_upscaling"]

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 2
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 1.0
  early_stop_patience: 10
  monitor: val/centerline_mae
  monitor_mode: min

dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/processed_endpoints
  val_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 8
  num_workers: 4
  distance_transform: true
  aug:
    scale: [0.9, 1.1]
    hflip: 0.5
    vflip: 0.5
    color_jitter_p: 0.1
    gauss_noise_p: 0.0

model:
  name: sam_topolora
  sam_type: vit_b
  sam_checkpoint: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/checkpoints/sam_vit_b_01ec64.pth
  train_mask_decoder: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.0
    target_keywords: ["mlp", "fc1", "fc2"]
  adapter:
    enabled: true
    hidden_dim: 256
    kernel_size: 3
  prompt:
    learnable: false
  junction_head:
    enabled: true
    hidden_dim: 256
  centerline_head:
    enabled: true
    hidden_dim: 256

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  cldice_weight: 0.5
  boundary_weight: 0.0
  centerline_weight: 1.0
  centerline_bg_weight: 0.5

optimizer:
  name: adamw
  lr: 3e-4  # lower LR since shared features are updating
  weight_decay: 1e-4

scheduler:
  name: cosine

logging:
  wandb: false
  mlflow: true
  mlflow_validate: true
  mlflow_experiment: wall-centerline-head-unfreeze
  project: seglab
  entity: null
  tags: ["centerline_head", "distance_transform", "unfreeze_upscaling", "seg_loss_active"]

artifacts:
  save_test_preds: true
  save_figures: false
  sample_pixels: 200000
  sample_pixels_per_image: 5000
  max_qual: 8
  bf_tol: 1
