# Stable training configuration for wall centerline detection
# Fixes for gradient explosion issue at epoch 7
# Resume from epoch 5 checkpoint with these settings

experiment: wall_centerline_stable
seed: 0

# Training from scratch with stable config (FP32, lower LR, tighter grad clip)
# ckpt_path: null  # Start fresh - epoch 5 checkpoint was overwritten

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 30  # Reduced from 50
  accelerator: gpu
  devices: 1
  precision: 32  # FP32 with TF32 for numerical stability + speed
  accumulate_grad_batches: 4  # Effective batch size = 4
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 0.5  # Tighter than original (was 1.0)
  early_stop_patience: 5  # Stop if no improvement for 5 consecutive epochs

dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA‑SAM/processed
  train_split: train
  test_split: test
  val_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 1  # Actual batch size (accumulate_grad_batches=4 for effective batch=4)
  num_workers: 4
  aug:
    scale: [0.9, 1.1]
    hflip: 0.5
    vflip: 0.5
    color_jitter_p: 0.1
    gauss_noise_p: 0.0

model:
  name: sam_topolora
  sam_type: vit_b
  sam_checkpoint: checkpoints/sam_vit_b_01ec64.pth
  train_mask_decoder: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.0
    target_keywords: ["mlp", "fc1", "fc2"]
  adapter:
    enabled: true
    hidden_dim: 256
    kernel_size: 3
  prompt:
    learnable: false

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  cldice_weight: 0.5
  boundary_weight: 0.0

optimizer:
  name: adamw
  lr: 5e-5  # Reduced from 1e-4 for more stable fine-tuning
  weight_decay: 1e-4

scheduler:
  name: cosine  # Cosine annealing for smooth LR decay
  warmup_epochs: 0  # No warmup since resuming from trained model

logging:
  wandb: false
  mlflow: true
  mlflow_validate: true
  mlflow_experiment: wall-semantic-segmentation
  project: seglab
  entity: null
  tags: ["stable", "resume_from_epoch5", "fp32", "lower_lr"]

artifacts:
  save_test_preds: true
  save_figures: false
  sample_pixels: 200000
  sample_pixels_per_image: 5000
  max_qual: 8
  bf_tol: 1
