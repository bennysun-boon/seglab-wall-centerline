# Frame field + segmentation joint training from scratch.
# Multi-task: seg regularises FF, FF sharpens seg boundaries (bidirectional).
# Predicts: interior mask + edge map + 4ch frame field (c0, c2 coefficients).
# Post-processing: skeleton → ASM → corner detection → polygon graph.
#
# ff_angle_error uses trig (no torch.complex/sqrt) — safe to monitor from ep 0.

experiment: paving_frame_field
seed: 0

freeze_existing: false

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  accumulate_grad_batches: 8    # effective batch = 2*8 = 16
  log_every_n_steps: 50
  deterministic: warn
  gradient_clip_val: 1.0
  early_stop_patience: 15
  monitor: val/ff_angle_error
  monitor_mode: min

dataset:
  type: paving
  name: paving
  root: /home/bensunshine/ml-training-platform/paving/TopoLoRA-SAM/processed
  val_ratio: 0.15
  test_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 2
  num_workers: 12
  prefetch_factor: 8
  border_edt: false
  frame_field: true
  annotations_path: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/data_full/annotations.json
  ff_thickness: 6           # lydorn: line_width=6 (was 2)
  aug:
    scale: [0.75, 1.25]
    hflip: 0.5
    vflip: 0.5
    rotate90_p: 0.5             # theta-aware: stripped from albumentations, applied manually (k*π/2 shift)
    rotate_p: 0.0               # arbitrary rotation — disabled: all 700 source PDFs are landscape,
    rotate_limit_deg: 45        # no rotated plans detected (wall_centerline risk doesn't apply here)
    color_jitter_p: 0.35
    gauss_blur_p: 0.2
    gauss_noise_p: 0.1

model:
  name: sam_topolora
  sam_type: vit_b
  sam_checkpoint: /home/bensunshine/ml-training-platform/paving/TopoLoRA-SAM/Seglab/checkpoints/sam_vit_b_01ec64.pth
  train_mask_decoder: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    target_keywords: ["mlp", "qkv", "proj"]
  adapter:
    enabled: true
    hidden_dim: 256
    kernel_size: 3
  prompt:
    learnable: false
  border_edt_head:
    enabled: false
  poly_head:
    enabled: false
  frame_field_head:
    enabled: true
    hidden_dim: 256

loss:
  bce_weight: 1.0
  dice_weight: 0.2          # lydorn: dice_coef=0.2 (was 1.0)
  cldice_weight: 0.0
  boundary_weight: 0.0
  border_edt_weight: 0.0
  vmap_weight: 0.0
  voff_weight: 0.0

  # Loss normalization (FFL Section 3.2): run normalize_batches forward passes before
  # training, average each loss component, divide by that value during training.
  # All losses are ~1.0 at init before weighting.
  normalize: true
  normalize_batches: 100

  # lydorn: seg=10, FF=1 → frame_field_weight = 1/10 = 0.1 relative to seg
  frame_field_weight: 0.1   # was 1.0
  ff_edge_weight: 0.0       # lydorn: NO edge loss in FF head (was 0.5)
  ff_align_weight: 1.0      # lydorn: crossfield_align=1
  ff_align90_weight: 0.2    # lydorn: crossfield_align90=0.2
  ff_smooth_weight: 0.005   # lydorn: crossfield_smooth=0.005
  # lydorn: coupling=[0,0,0.2] at epoch_thresholds=[0,5,10]
  # Linear ramp from 0 → full weight between coupling_epoch_start and coupling_epoch_end
  ff_int_coupling_weight: 0.2
  ff_int_edge_weight: 0.2
  coupling_epoch_start: 5   # coupling weight = 0 before this epoch
  coupling_epoch_end: 10    # coupling weight = full after this epoch (linear ramp between)

optimizer:
  name: adamw
  lr: 5e-4              # default (frame_field_head residual + anything unmatched)
  weight_decay: 1e-4
  param_groups:
    - keywords: ["lora", "adapter"]
      lr: 5e-6           # encoder — gentle, already conditioned on civil plan data
    - keywords: ["mask_decoder"]
      lr: 5e-5           # decoder — moderate
    - keywords: ["frame_field_head"]
      lr: 5e-4           # new head from scratch — fast

scheduler:
  name: constant_with_warmup
  warmup_steps: 500      # ~0.4 epochs; protects encoder from early FF noise gradients

logging:
  wandb: false
  mlflow: true
  mlflow_validate: true
  mlflow_experiment: paving-frame-field
  project: seglab
  entity: null
  tags: ["paving", "frame_field", "joint", "from_scratch", "multi_task"]

artifacts:
  save_test_preds: false
  save_figures: false
  sample_pixels: 100000
  sample_pixels_per_image: 2000
  max_qual: 4
  bf_tol: 1
