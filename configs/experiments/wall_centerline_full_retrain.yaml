# Full retrain: seg + centerline heads on 300-PDF combined dataset
# Train from SAM base checkpoint (no transfer from wall seg)
# All weights in fp16-mixed from scratch — no precision mismatch
# Per-polygon normalized DT labels (every wall ridge = 1.0)

experiment: wall_centerline_full_retrain
seed: 0

# Resume from epoch 3 (dice=0.799, MAE=0.1636)
transfer_ckpt: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/Seglab/checkpoints/wall_centerline_full_retrain/wall_centerline/sam_topolora/seed0/epoch=3-val/centerline_mae=0.1636.ckpt

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 50
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  accumulate_grad_batches: 4  # effective batch = 4*4 = 16
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 1.0
  early_stop_patience: 8
  monitor: val/centerline_mae
  monitor_mode: min

dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/processed_v2
  val_ratio: 0.15
  test_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 4  # OOM at 8 with full retrain (5.9M trainable params + optimizer states)
  num_workers: 4
  distance_transform: true
