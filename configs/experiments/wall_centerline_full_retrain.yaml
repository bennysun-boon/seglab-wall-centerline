# Full retrain from scratch: seg + centerline heads on 300-PDF combined dataset
# bf16-mixed (A100 native — fp32 dynamic range, NaN-resistant for Sobel backprop)
# Sobel gradient loss masked to wall pixels — sharpens ridge peaks
# Per-polygon normalized DT labels (every wall ridge = 1.0)
# Warmup scheduler: 1e-6 → 1e-4 over 4 epochs, then flat 1e-4

experiment: wall_centerline_full_retrain
seed: 0
# No transfer_ckpt — training from SAM base (clean slate, no checkpoint shock)

paths:
  results_dir: results
  checkpoints_dir: checkpoints
  figures_dir: figures
  tables_dir: tables
  cache_dir: cache

trainer:
  max_epochs: 50
  accelerator: gpu
  devices: 1
  precision: bf16-mixed  # A100 native — fp32 dynamic range, 16-bit speed, NaN-resistant
  accumulate_grad_batches: 4  # effective batch = 4*4 = 16
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 0.5  # tighter — Sobel loss creates derivative-of-derivative spikes
  early_stop_patience: 10  # more patience at lower LR
  monitor: val/centerline_mae
  monitor_mode: min

dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/processed_v2
  val_ratio: 0.15
  test_ratio: 0.15
  size: 1024
  sar: false
  batch_size: 4  # OOM at 8 with full retrain (5.9M trainable params + optimizer states)
  num_workers: 4
  distance_transform: true
  force_train_pdfs:
