  aug:
    scale: [0.9, 1.1]
    hflip: 0.5
    vflip: 0.5
    color_jitter_p: 0.1
    gauss_noise_p: 0.0

model:
  name: sam_topolora
  sam_type: vit_b
  sam_checkpoint: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/checkpoints/sam_vit_b_01ec64.pth
  train_mask_decoder: true
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.0
    target_keywords: ["mlp", "fc1", "fc2"]
  adapter:
    enabled: true
    hidden_dim: 256
    kernel_size: 3
  prompt:
    learnable: false
  centerline_head:
    enabled: true
    hidden_dim: 256

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  cldice_weight: 0.5
  boundary_weight: 0.0
  centerline_weight: 3.0  # ~3x smaller raw values than seg loss with per-polygon norm
  centerline_bg_weight: 5.0  # increased from 0.5 — suppress background activations

optimizer:
  name: adamw
  lr: 1e-4  # standard for SAM LoRA from-scratch training
  weight_decay: 1e-4

scheduler:
  name: cosine

logging:
  wandb: false
  mlflow: true
  mlflow_validate: true
  mlflow_experiment: wall-centerline-full-retrain
  project: seglab
  entity: null
  tags: ["full_retrain", "seg_centerline", "300pdf", "fp16_mixed", "per_polygon_dt", "combined_dataset"]

artifacts:
  save_test_preds: true
  save_figures: false
  sample_pixels: 200000
  sample_pixels_per_image: 5000
  max_qual: 8
  bf_tol: 1
