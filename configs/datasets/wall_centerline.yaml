dataset:
  type: wall_centerline
  name: wall_centerline
  root: /home/bensunshine/ml-training-platform/wall_centerline/TopoLoRA-SAM/processed_ceil_floor
  # Split strategy: By PDF (not by tile) to prevent data leakage from overlapping tiles
  # All tiles from the same source PDF are kept together in the same split
  val_ratio: 0.15   # 15% of PDFs for validation
  test_ratio: 0.15  # 15% of PDFs for test (70% for training)
  size: 1024  # Match preprocessing tile_size
  sar: false  # Not SAR imagery
  batch_size: 1  # Use gradient accumulation instead (set in model config)
  num_workers: 4
  aug:
    scale: [0.9, 1.1]  # Conservative for architecture
    hflip: 0.5
    vflip: 0.5
    color_jitter_p: 0.1  # Light color jitter
    gauss_noise_p: 0.0
